name: Build Executables (Windows & Linux)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync

      - name: Build Executable with PyInstaller (Windows)
        if: runner.os == 'Windows'
        run: |
          uv run pyinstaller --noconfirm --onedir --windowed --add-data "assets;assets" --collect-submodules mediapipe --collect-data mediapipe --exclude-module matplotlib --exclude-module scipy --exclude-module tkinter --exclude-module PIL --exclude-module pandas --name "HamsterCam-Windows" main.py

      - name: Build Executable with PyInstaller (Linux)
        if: runner.os == 'Linux'
        run: |
          uv run pyinstaller --noconfirm --onedir --add-data "assets:assets" --collect-submodules mediapipe --collect-data mediapipe --exclude-module matplotlib --exclude-module scipy --exclude-module tkinter --exclude-module PIL --exclude-module pandas --name "HamsterCam-Linux" main.py

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HamsterCam-${{ runner.os }}
          path: dist/
